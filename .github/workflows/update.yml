name: Update TW Margin Report

on:
  schedule:
    # 台北時間（UTC+8）每週一至週五 晚上 21:00 自動更新（= UTC 13:00）
    # KGI 盤後資訊約 17:00~18:00（台北）更新當日資料，此排程可取到當日
    - cron: "0 13 * * 1-5"
  workflow_dispatch: {}   # 允許手動在 Actions 頁面點 Run workflow

# 需要寫回 repo 的權限（用 GITHUB_TOKEN 推送 index.html / chart_data_tw.json）
permissions:
  contents: write

jobs:
  build:
    # 資料源為 KGI MoneyDJ 盤後資訊（kgiweb.moneydj.com），每次執行皆為全量重建
    # （2 次 HTTP 呼叫，秒級完成）。若 GitHub runner 遭該站封鎖導致取不到資料，
    # 下方「Verify data freshness」會直接讓此 run 失敗，請改用自託管 runner：
    #   runs-on: self-hosted
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build data (KGI full rebuild) + render HTML
        env:
          OUTPUT_HTML: index.html
          TZ: Asia/Taipei
        run: |
          python build_tw.py
          python gen_html_tw.py

      - name: Verify data freshness
        env:
          TZ: Asia/Taipei
        run: |
          python - <<'EOF'
          import json
          from datetime import date, datetime
          d = json.load(open("chart_data_tw.json", encoding="utf-8"))
          last = datetime.strptime(d["dates"][-1], "%Y-%m-%d").date()
          age = (date.today() - last).days
          print(f"資料末日 = {last}  距今 {age} 天")
          # 容忍週末 + 連假（4 天）；超過視為資料源異常（如被 KGI 封鎖），讓 run 轉紅
          if age > 4:
              raise SystemExit(f"FAIL: 資料過期 {age} 天（末日 {last}），資料源可能被封鎖或改版")
          EOF

      - name: Commit & push if changed
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git add index.html chart_data_tw.json
          if git diff --cached --quiet; then
            echo "No changes — skip commit"
          else
            git commit -m "auto: update TW margin MA20 report ($(date +%Y-%m-%d))"
            git push
          fi
