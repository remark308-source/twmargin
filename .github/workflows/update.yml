name: Update TW Margin Report

on:
  schedule:
    # 台北交易日收盤後自動更新（台北 18:30 ≈ UTC 10:30；週一至週五）
    - cron: "30 10 * * 1-5"
  workflow_dispatch: {}   # 允許手動在 Actions 頁面點 Run workflow

# 需要寫回 repo 的權限（用 GITHUB_TOKEN 推送 index.html / chart_data_tw.json）
permissions:
  contents: write

jobs:
  build:
    # 若改用「自託管 runner」確保 TPEx 櫃買資料可達，把下面這行改成： runs-on: self-hosted
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build data (incremental) + render HTML
        env:
          OUTPUT_HTML: index.html
          TZ: Asia/Taipei
        run: |
          python build_tw.py
          python gen_html_tw.py

      - name: Commit & push if changed
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git add index.html chart_data_tw.json
          if git diff --cached --quiet; then
            echo "No changes — skip commit"
          else
            git commit -m "auto: update TW margin MA20 report ($(date +%Y-%m-%d))"
            git push
          fi
